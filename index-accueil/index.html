<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/mise-en-page.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/composants.css">
    <title>Livrio</title>
</head>

<body>
    <header>
        <nav>
            <a href="../index-accueil/index.html">
                <img class="logo-nav div-lien-nav" src="../assets/livrio-logo.png" alt="logo-site">
            </a>
            <div class="div-lien-nav">
                <a href="../index-accueil/index.html">
                    <img class="lien" src="../assets/lens.svg" alt="icône-loupe">
                </a>
                <a href="../library/library.html">
                    <img class="lien" src="../assets/library.svg" alt="icône-biblio">
                </a>
                <a href="../profil/profil.html">
                    <img class="lien" src="../assets/profile.svg" alt="icône-profil">
                </a>
            </div>

        </nav>
    </header>
    <main>
        <section>
            <div class="container">
                <div class="search-bar">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" placeholder="Rechercher..." aria-label="Rechercher">
                    <button type="button" class="clear-btn" aria-label="Effacer la recherche"
                        onclick="this.previousElementSibling.value='';this.previousElementSibling.focus();this.style.display='none'">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
                <fieldset>
                    <legend>Filtrer par genre</legend>

                    <div>
                        <input type="checkbox" id="genre-roman" name="genre" value="roman">
                        <label for="genre-roman">Roman</label>
                    </div>

                    <div>
                        <input type="checkbox" id="genre-sf" name="genre" value="science-fiction">
                        <label for="genre-sf">Science-fiction</label>
                    </div>

                    <div>
                        <input type="checkbox" id="genre-fantasy" name="genre" value="fantasy">
                        <label for="genre-fantasy">Fantasy</label>
                    </div>

                    <div>
                        <input type="checkbox" id="genre-policier" name="genre" value="policier">
                        <label for="genre-policier">Policier</label>
                    </div>

                    <div>
                        <input type="checkbox" id="genre-bio" name="genre" value="biographie">
                        <label for="genre-bio">Biographie</label>
                    </div>

                    <div>
                        <input type="checkbox" id="genre-jeunesse" name="genre" value="jeunesse">
                        <label for="genre-jeunesse">Jeunesse</label>
                    </div>

                    <div>
                        <input type="checkbox" id="genre-bd" name="genre" value="bande-dessinee">
                        <label for="genre-bd">Bande dessinée</label>
                    </div>

                </fieldset>
            </div>
        </section>
        <div id="container">
            <div class="grille-flex-wrap"></div>
        </div>
        <section>
    </main>
    <footer>
        <div class="div-footer container">
            <div>
                <div class="contact-us">
                    <h4>CONTACTEZ-NOUS</h4>
                    <p>livrio@gmail.com</p>
                    <p>04 56 78 90 34</p>
                </div>
                <div class="logo-rs-colomn">
                    <div class="lien-reseaux-sociaux-row">
                        <a href=""><img class="icon" src="../assets/facebook.svg" alt="icône-facebook"></a>
                        <a href=""><img class="icon" src="../assets/instagram.svg" alt="icône-instagram"></a>
                        <a href=""><img class="icon" src="../assets/x.svg" alt="icône-x"></a>
                    </div>
                </div>
            </div>

            <div class="subscribe">
                <h4>ABONNEZ-VOUS</h4>
                <p>Recevez chaque moi la newsletter de Livrio</p>
                <form action="#" method="post"></form>
                <label for="email">Entrer votre adresse mail</label>
                <input type="text" id="email">
                <button type="submit">Envoyer</button>
            </div>

        </div>
        <div class="div-signature">
            <p>Stage - septembre 2026</p>
        </div>
    </footer>
    <script src="../js/donnees.js"></script>
    <script src="../js/bibliotheque.js"></script>
    <script src="../js/rendu.js"></script>
</body>

</html>
