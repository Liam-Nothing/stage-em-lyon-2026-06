<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>"donnez votre avis sur un livre</h1>

    <form action="#" method="post"></form>
        <label for="titre-livre">Titre du livre</label>
        <input type="text" id="titre-livre">
        
        <fieldset>
            <legend>Note sur 5</legend>
            
            <div>
                <input type="radio" id="note-1" name="note" value="1">
                <label for="note-1">1 - Décevant</label>
            </div>

            <div>
                <input type="radio" id="note-2" name="note" value="2">
                <label for="note-2">2 - Moyen</label>
            </div>
            
            <div>
                <input type="radio" id="note-3" name="note" value="3">
                <label for="note-3">3 - Correct</label>
            </div>
            
            <div>
                <input type="radio" id="note-4" name="note" value="4">
                <label for="note-4">4 - Très Bon</label>
            </div>
            
            <div>
                <input type="radio" id="note-5" name="note" value="5">
                <label for="note-5">5 - Excellent</label>
            </div>
               
        </fieldset>
        <button type="submit">Envoyer</button>
    </form>
     <div class="div-formulaire-avis">
                <h4>Ajouter un avis</h4>
                <form action="" method="post">
                    <ul>
                        <li class="champ-saisie">
                            <label for="date-fin-lecture">Date de fin de lecture</label>
                            <input type="date" name="date-fin-lecture" id="date-fin-lecture" value="2026-09-01" min="2000-01-01" max="2028-01-01">
                        </li>
                        <li class="champ-saisie">
                            <label for="message-avis">Parle nous de ta lecture</label>
                            <textarea id="message-avis" name="message-avis"></textarea>
                        </li>
                    </ul>
                    <div class="div-button-form">
                        <button>Annuler</button>
                        <button>Publier</button>
                    </div>
                </form>
            </div>
</body>
</html>
